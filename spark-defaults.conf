# spark-defaults.conf
#
# Fixes: "FileNotFoundException: /home/spark/.ivy2/cache/resolved-..."
# when using --packages with spark-submit.
#
# Cause: the default Ivy cache location (~/.ivy2, i.e. /home/spark/.ivy2
# in this image) isn't writable by whatever user the container actually
# runs as. /tmp is reliably writable regardless of user, so point Ivy's
# cache there instead -- applies automatically to every spark-submit,
# no need to pass --conf spark.jars.ivy=/tmp/.ivy2 by hand each time.
spark.jars.ivy /tmp/.ivy2
spark.sql.shuffle.partitions       4
spark.default.parallelism          4
spark.driver.memory                512m
spark.sql.streaming.metricsEnabled false